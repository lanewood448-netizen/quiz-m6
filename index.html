<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry Quiz: Solids & Liquids</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider round">
                <i class="fas fa-sun"></i>
                <i class="fas fa-moon"></i>
            </div>
        </label>
    </div>

    <div class="container">
        <section id="auth-section" class="card">
            <h1><i class="fas fa-flask"></i> แบบทดสอบเคมี</h1>
            <p>เรื่อง ของแข็งและของเหลว</p>
            <form id="login-form">
                <div class="input-group">
                    <input type="text" id="fname" placeholder="ชื่อ" required>
                    <input type="text" id="lname" placeholder="นามสกุล" required>
                </div>
                <div class="input-group">
                    <input type="text" id="grade" placeholder="ชั้น (เช่น ม.4/1)" required>
                    <input type="number" id="no" placeholder="เลขที่" required>
                </div>
                <button type="submit" class="btn-primary">เริ่มทำข้อสอบ</button>
            </form>
        </section>

        <section id="quiz-section" class="card hidden">
            <div class="quiz-header">
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="quiz-info">
                    <span id="question-number">ข้อที่ 1/10</span>
                    <span id="timer"><i class="fas fa-clock"></i> 10:00</span>
                </div>
            </div>

            <div id="question-container">
                <h2 id="question-text">คำถามจะปรากฏที่นี่</h2>
                <div id="options-container" class="options-grid">
                    </div>
            </div>

            <div class="quiz-footer">
                <button id="prev-btn" class="btn-secondary" disabled>ย้อนกลับ</button>
                <button id="next-btn" class="btn-primary">ถัดไป</button>
                <button id="submit-btn" class="btn-success hidden">ส่งข้อสอบ</button>
            </div>
        </section>

        <section id="result-section" class="card hidden">
            <h2><i class="fas fa-poll-h"></i> สรุปผลคะแนน</h2>
            <div id="user-summary"></div>
            <div class="score-display">
                <span id="final-score">0</span> / <span id="total-score">10</span>
            </div>
            <div id="analysis-container">
                </div>
            <button onclick="location.reload()" class="btn-primary">ทำใหม่อีกครั้ง</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
