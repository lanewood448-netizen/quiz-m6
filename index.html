<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chemistry Quiz 🧪 ของแข็งและของเหลว</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="header-ui">
            <span class="logo">🧪 ChemQuiz</span>
            <button id="theme-toggle">🌙</button>
        </div>

        <div id="setup-page" class="page active">
            <div class="card">
                <h2>ยินดีต้อนรับ ✨</h2>
                <p>กรุณากรอกข้อมูลเพื่อเริ่มสอบ</p>
                <input type="text" id="user-name" placeholder="ชื่อ-นามสกุล">
                <input type="text" id="user-class" placeholder="ชั้น (เช่น ม.5/1)">
                <input type="number" id="user-no" placeholder="เลขที่">
                <button class="btn-main" onclick="startApp()">เริ่มทำข้อสอบ</button>
            </div>
        </div>

        <div id="quiz-page" class="page">
            <div class="status-bar">
                <div id="timer">⏳ 15:00</div>
                <div id="q-count">ข้อ 1/10</div>
            </div>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>

            <div class="card">
                <h3 id="question-text">คำถามจะแสดงที่นี่</h3>
                <div id="options-list"></div>
            </div>

            <div class="nav-controls">
                <button class="btn-sub" id="prev-btn" onclick="prevQ()">ย้อนกลับ</button>
                <button class="btn-main" id="next-btn" onclick="nextQ()">ถัดไป</button>
                <button class="btn-done hidden" id="finish-btn" onclick="showConfirm()">ส่งข้อสอบ 📝</button>
            </div>
        </div>

        <div id="result-page" class="page">
            <div class="card result-card">
                <h2>🎉 เย้! สอบเสร็จแล้ว</h2>
                <div id="user-info-display"></div>
                <div class="score-circle">
                    <span id="score-num">0</span>/10
                </div>
                <div class="bar-result-bg">
                    <div id="score-bar"></div>
                </div>
                <p id="score-percent">0%</p>
                <div id="correction-list"></div>
                <button class="btn-main" onclick="location.reload()">ทำใหม่อีกครั้ง 🔄</button>
            </div>
        </div>

        <div id="confirm-modal" class="modal">
            <div class="modal-content">
                <h3>ยืนยันการส่ง?</h3>
                <p id="unanswered-msg"></p>
                <div class="modal-btns">
                    <button class="btn-sub" onclick="hideConfirm()">ทำต่อ</button>
                    <button class="btn-main" onclick="submitQuiz()">ส่งเลย 🚀</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
