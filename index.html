<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>แบบทดสอบ ของแข็งและของเหลว</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Kanit', sans-serif;
  background: linear-gradient(135deg, #4facfe, #8e44ad);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

.container {
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.3);
  width: 500px;
}

button {
  width: 100%;
  margin: 8px 0;
  padding: 10px;
  border: none;
  border-radius: 12px;
  background: #00c6ff;
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #6a11cb;
  transform: scale(1.05);
}

#result {
  margin-top: 15px;
  font-size: 14px;
}
</style>
</head>
<body>

<div class="container">
  <h2 id="question"></h2>
  <div id="choices"></div>
  <div id="result"></div>
</div>

<script>
const quiz = [
{
  q: "1) ของแข็งมีลักษณะใด",
  choices: ["รูปร่างคงที่ ปริมาตรคงที่", "รูปร่างไม่คงที่ ปริมาตรคงที่", "รูปร่างและปริมาตรไม่คงที่"],
  answer: 0,
  explanation: "ของแข็งมีแรงยึดเหนี่ยวระหว่างอนุภาคสูง ทำให้รูปร่างและปริมาตรคงที่"
},
{
  q: "2) ของเหลวมีลักษณะใด",
  choices: ["รูปร่างคงที่", "ปริมาตรคงที่แต่รูปร่างเปลี่ยนตามภาชนะ", "ไม่มีปริมาตรแน่นอน"],
  answer: 1,
  explanation: "ของเหลวมีปริมาตรคงที่ แต่รูปร่างเปลี่ยนตามภาชนะ"
},
{
  q: "3) แรงยึดเหนี่ยวระหว่างอนุภาคของของแข็งเป็นอย่างไร",
  choices: ["ต่ำมาก", "ปานกลาง", "สูงมาก"],
  answer: 2,
  explanation: "ของแข็งมีแรงยึดเหนี่ยวสูง ทำให้อณูเคลื่อนที่ได้น้อย"
},
{
  q: "4) ปรากฏการณ์ความตึงผิวพบในสถานะใด",
  choices: ["ของแข็ง", "ของเหลว", "แก๊ส"],
  answer: 1,
  explanation: "ความตึงผิวเกิดจากแรงยึดเหนี่ยวของอนุภาคของเหลว"
},
{
  q: "5) ของเหลวสามารถไหลได้เพราะอะไร",
  choices: ["อนุภาคยึดติดแน่น", "อนุภาคเคลื่อนที่ผ่านกันได้", "ไม่มีแรงยึดเหนี่ยว"],
  answer: 1,
  explanation: "อนุภาคของเหลวเคลื่อนที่ผ่านกันได้ ทำให้ไหลได้"
},
{
  q: "6) ความหนาแน่นคืออะไร",
  choices: ["มวลต่อปริมาตร", "ปริมาตรต่อมวล", "แรงต่อพื้นที่"],
  answer: 0,
  explanation: "ความหนาแน่น = มวล / ปริมาตร"
},
{
  q: "7) น้ำแข็งลอยน้ำเพราะอะไร",
  choices: ["หนักกว่า", "ความหนาแน่นน้อยกว่า", "ไม่มีมวล"],
  answer: 1,
  explanation: "น้ำแข็งมีความหนาแน่นน้อยกว่าน้ำ จึงลอยได้"
},
{
  q: "8) การหลอมเหลวคืออะไร",
  choices: ["ของแข็งกลายเป็นของเหลว", "ของเหลวกลายเป็นแก๊ส", "แก๊สกลายเป็นของแข็ง"],
  answer: 0,
  explanation: "การหลอมเหลวคือการเปลี่ยนสถานะจากของแข็งเป็นของเหลว"
},
{
  q: "9) ของแข็งผลึกมีลักษณะอย่างไร",
  choices: ["อนุภาคเรียงตัวเป็นระเบียบ", "ไม่เป็นระเบียบ", "ไม่มีโครงสร้าง"],
  answer: 0,
  explanation: "ของแข็งผลึกมีโครงสร้างเรียงตัวเป็นระเบียบ"
},
{
  q: "10) ความดันของของเหลวขึ้นกับอะไร",
  choices: ["ความลึก", "สีของของเหลว", "อุณหภูมิห้อง"],
  answer: 0,
  explanation: "ความดันของของเหลวเพิ่มตามความลึก"
}
];

let current = 0;

function loadQuestion() {
  document.getElementById("result").innerHTML = "";
  const q = quiz[current];
  document.getElementById("question").innerText = q.q;
  const choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";
  
  q.choices.forEach((choice, index) => {
    const btn = document.createElement("button");
    btn.innerText = choice;
    btn.onclick = () => checkAnswer(index);
    choicesDiv.appendChild(btn);
  });
}

function checkAnswer(index) {
  const result = document.getElementById("result");
  if(index === quiz[current].answer){
    result.innerHTML = "✅ ถูกต้อง<br>" + quiz[current].explanation;
  } else {
    result.innerHTML = "❌ ผิด<br>" + quiz[current].explanation;
  }

  current++;
  if(current < quiz.length){
    setTimeout(loadQuestion, 2500);
  } else {
    setTimeout(() => {
      document.querySelector(".container").innerHTML = "<h2>จบแบบทดสอบแล้ว 🎉</h2>";
    }, 2500);
  }
}

loadQuestion();
</script>

</body>
</html>
