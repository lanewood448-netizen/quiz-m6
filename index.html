<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry Quiz 🧪 ของแข็งและของเหลว ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🧪 ChemQuiz น่ารักๆ</h1>
            <button id="theme-toggle" class="btn-icon">🌙</button>
        </header>

        <section id="user-info-section" class="card active">
            <h2>📝 ลงทะเบียนก่อนสอบ</h2>
            <div class="input-group">
                <input type="text" id="fname" placeholder="ชื่อ" required>
                <input type="text" id="lname" placeholder="นามสกุล" required>
            </div>
            <div class="input-group">
                <input type="text" id="user-class" placeholder="ชั้น (เช่น ม.5/1)" required>
                <input type="number" id="roll-num" placeholder="เลขที่" required>
            </div>
            <button id="start-btn" class="btn-primary">เริ่มทำข้อสอบ ✨</button>
        </section>

        <section id="quiz-section" class="card hidden">
            <div class="quiz-header">
                <div class="timer">⏳ เวลา: <span id="time-display">15:00</span></div>
                <div class="progress-text">ข้อ <span id="current-q-num">1</span> / 10</div>
            </div>
            
            <div class="progress-bar-container">
                <div id="progress-bar"></div>
            </div>

            <div id="question-container">
                <h3 id="question-text">คำถามจะแสดงที่นี่</h3>
                <div id="options-container">
                    </div>
            </div>

            <div class="quiz-nav">
                <button id="prev-btn" class="btn-secondary" disabled>⬅️ ย้อนกลับ</button>
                <button id="next-btn" class="btn-primary">ถัดไป ➡️</button>
                <button id="submit-btn" class="btn-danger hidden">ส่งข้อสอบ 📝</button>
            </div>
        </section>

        <section id="result-section" class="card hidden">
            <h2>🎉 สรุปผลการทดสอบ</h2>
            <div id="user-summary" class="user-summary"></div>
            
            <div class="score-board">
                <h3>คะแนนของคุณ</h3>
                <div class="score-text"><span id="score-display">0</span> / 10</div>
                <div class="percent-bar-container">
                    <div id="percent-bar"></div>
                </div>
                <div id="percent-text">0%</div>
            </div>

            <div class="time-summary">
                <p>⏱️ ใช้เวลาไปทั้งหมด: <span id="total-time-spent">00:00</span></p>
            </div>

            <div id="review-container">
                </div>

            <button id="restart-btn" class="btn-primary" style="margin-top: 20px;">ทำข้อสอบอีกครั้ง 🔄</button>
        </section>

        <div id="summary-modal" class="modal hidden">
            <div class="modal-content card">
                <h3>⚠️ ยืนยันการส่งข้อสอบ</h3>
                <p id="unanswered-text">คุณตอบครบทุกข้อแล้ว เก่งมาก! ✨</p>
                <div class="modal-actions">
                    <button id="cancel-submit" class="btn-secondary">กลับไปทำต่อ</button>
                    <button id="confirm-submit" class="btn-danger">ยืนยันส่ง 🚀</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
