<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบเคมี: ของแข็งและของเหลว</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="theme-toggle">
        <button id="darkModeBtn">🌙 Dark Mode</button>
    </div>

    <div class="container">
        <div id="registerScreen" class="screen active">
            <h1>📝 แบบทดสอบวิชาเคมี</h1>
            <h2>เรื่อง ของแข็งและของเหลว</h2>
            <form id="userForm">
                <div class="form-group">
                    <label for="fname">ชื่อ:</label>
                    <input type="text" id="fname" required>
                </div>
                <div class="form-group">
                    <label for="lname">นามสกุล:</label>
                    <input type="text" id="lname" required>
                </div>
                <div class="form-group">
                    <label for="studentClass">ชั้น:</label>
                    <input type="text" id="studentClass" placeholder="เช่น ม.4/1" required>
                </div>
                <div class="form-group">
                    <label for="studentNumber">เลขที่:</label>
                    <input type="number" id="studentNumber" required min="1">
                </div>
                <button type="submit" class="btn primary-btn">เริ่มทำข้อสอบ</button>
                <button type="button" id="resumeBtn" class="btn secondary-btn hidden">ทำข้อสอบที่ค้างไว้ต่อ</button>
            </form>
        </div>

        <div id="quizScreen" class="screen hidden">
            <div class="quiz-header">
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="status-bar">
                    <span id="questionCount">ข้อ 1 / 10</span>
                    <span id="timer" class="timer">⏱️ 10:00</span>
                </div>
            </div>

            <div class="question-container">
                <h3 id="questionText">คำถามจะแสดงที่นี่</h3>
                <div id="optionsContainer" class="options">
                    </div>
            </div>

            <div class="navigation-buttons">
                <button id="prevBtn" class="btn nav-btn">⬅️ ย้อนกลับ</button>
                <button id="nextBtn" class="btn nav-btn">ถัดไป ➡️</button>
                <button id="submitBtn" class="btn primary-btn hidden">ส่งข้อสอบ 📝</button>
            </div>
        </div>

        <div id="resultScreen" class="screen hidden">
            <h1>🏆 สรุปผลการสอบ</h1>
            <div class="user-summary" id="userInfoDisplay"></div>
            <div class="score-display">
                <span id="scoreText">0 / 10</span>
                <p>คะแนนของคุณ</p>
            </div>
            
            <div class="wrong-answers-section" id="wrongAnswersContainer">
                <h3>💡 ทบทวนข้อที่ตอบผิด</h3>
                </div>
            <button id="restartBtn" class="btn secondary-btn">เริ่มทำใหม่ (ล้างข้อมูล)</button>
        </div>

        <div id="confirmModal" class="modal hidden">
            <div class="modal-content">
                <h3>⚠️ ยืนยันการส่งข้อสอบ</h3>
                <p id="unansweredWarning"></p>
                <div class="modal-actions">
                    <button id="cancelSubmit" class="btn nav-btn">กลับไปทำต่อ</button>
                    <button id="confirmSubmit" class="btn primary-btn">ยืนยันส่งข้อสอบ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
