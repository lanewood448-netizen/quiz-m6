<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบทำข้อสอบออนไลน์</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ===== หน้าเก็บข้อมูลนักเรียน ===== -->
    <div id="student-form" class="card">
        <h2>ข้อมูลผู้เข้าสอบ</h2>

        <label>ชื่อ</label>
        <input type="text" id="firstName" placeholder="กรอกชื่อ">

        <label>นามสกุล</label>
        <input type="text" id="lastName" placeholder="กรอกนามสกุล">

        <label>ชั้น</label>
        <input type="text" id="classRoom" placeholder="เช่น ม.6/1">

        <label>เลขที่</label>
        <input type="number" id="number" placeholder="เลขที่">

        <button onclick="startQuiz()">เริ่มทำข้อสอบ</button>
    </div>


    <!-- ===== ระบบข้อสอบ ===== -->
    <div id="quiz-container" style="display: none;">

        <!-- แถบบน -->
        <div class="top-bar">
            <div id="student-display"></div>
            <div id="timer">10:00</div>
            <button onclick="toggleDarkMode()">🌙</button>
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar">
            <div id="progress"></div>
        </div>

        <!-- คำถาม -->
        <div class="card">
            <h3 id="question-number"></h3>
            <h2 id="question-text"></h2>
            <div id="choices"></div>
        </div>

        <!-- ปุ่มควบคุม -->
        <div class="nav-buttons">
            <button onclick="prevQuestion()">ย้อนกลับ</button>
            <button onclick="markForReview()">ทำเครื่องหมาย</button>
            <button onclick="nextQuestion()">ถัดไป</button>
        </div>

        <div class="submit-section">
            <button onclick="submitQuiz()">ส่งข้อสอบ</button>
        </div>

        <!-- ผลลัพธ์ -->
        <div id="result-section" style="display: none;">
            <h2>สรุปผลคะแนน</h2>
            <div id="result-content"></div>
        </div>

    </div>


    <script src="js/script.js"></script>
</body>
</html>
