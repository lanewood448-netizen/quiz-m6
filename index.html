<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบข้อสอบ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="student-form" class="card">
  <h2>ข้อมูลผู้เข้าสอบ</h2>

  <input type="text" id="firstName" placeholder="ชื่อ">
  <input type="text" id="lastName" placeholder="นามสกุล">
  <input type="text" id="classRoom" placeholder="ชั้น">
  <input type="number" id="number" placeholder="เลขที่">

  <button onclick="startQuiz()">เริ่มทำข้อสอบ</button>
</div>

<div id="quiz-container" style="display:none;">
  <div class="card">
    <h2 id="question"></h2>
    <div id="choices"></div>
    <button onclick="nextQuestion()">ถัดไป</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
