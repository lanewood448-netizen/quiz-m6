<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinnabut 💖 Chemistry Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="theme-toggle" onclick="toggleTheme()">🌙/☀️</div>

    <div class="container">
        <div id="login-screen" class="screen active">
            <h1 class="logo glow-text">✨ Chinnabut ✨</h1>
            <p class="subtitle">แบบทดสอบเคมี: ของแข็ง & ของเหลว</p>
            <form id="user-form">
                <div class="input-group">
                    <input type="text" id="fname" placeholder="ชื่อ" required>
                    <input type="text" id="lname" placeholder="นามสกุล" required>
                </div>
                <div class="input-group">
                    <input type="text" id="student-class" placeholder="ชั้นเรียน (เช่น ม.4/1)" required>
                    <input type="number" id="student-number" placeholder="เลขที่" required>
                </div>
                <button type="submit" class="btn btn-primary bounce">เริ่มทำข้อสอบเลย! 🚀</button>
            </form>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <span id="question-tracker" class="badge">ข้อ 1 / 10</span>
                <span id="timer" class="badge timer-badge">⏱️ 10:00</span>
            </div>
            
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div class="question-container box-shadow">
                <h2 id="question-text">คำถามจะแสดงที่นี่?</h2>
                <div id="options-container" class="options">
                    </div>
            </div>

            <div class="nav-buttons">
                <button id="btn-prev" class="btn btn-secondary" onclick="prevQuestion()" disabled>◀ ย้อนกลับ</button>
                <button id="btn-next" class="btn btn-primary" onclick="nextQuestion()">ถัดไป ▶</button>
                <button id="btn-summary" class="btn btn-warning hidden" onclick="showSummary()">ดูสรุป 📝</button>
            </div>
        </div>

        <div id="summary-screen" class="screen">
            <h2 class="glow-text">สรุปการทำข้อสอบ 📋</h2>
            <div id="summary-list" class="summary-list"></div>
            <div class="nav-buttons" style="justify-content: center; gap: 15px;">
                <button class="btn btn-secondary" onclick="backToQuiz()">กลับไปแก้</button>
                <button class="btn btn-danger bounce" onclick="submitQuiz()">ส่งข้อสอบจริง! ✅</button>
            </div>
        </div>

        <div id="result-screen" class="screen">
            <h1 class="glow-text">🎉 สรุปผลคะแนน 🎉</h1>
            <div id="user-info-display" class="user-info-card box-shadow"></div>
            <div class="score-display">
                <span id="final-score">0</span> / 10
            </div>
            <div id="explanations-container" class="explanations">
                </div>
            <button class="btn btn-primary bounce mt-2" onclick="location.reload()">ทำใหม่อีกครั้ง 🔁</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
